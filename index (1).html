<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Starting XI — 라인업 맞히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1824; --bg2:#15212f; --line:#233346; --ink:#e8eef5; --muted:#8497ad;
  --grass1:#1d5a3a; --grass2:#21643f; --chalk:rgba(255,255,255,.55);
  --amber:#f2b84b; --ok:#3fa66b; --near:#d4ac35; --miss:#3d4a5a; --bad:#d9594c;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1824;--bg2:#15212f;--line:#233346;--ink:#e8eef5;--muted:#8497ad}}
:root[data-theme="dark"]{--bg:#0f1824;--bg2:#15212f;--line:#233346;--ink:#e8eef5;--muted:#8497ad}
:root[data-theme="light"]{--bg:#1a2635;--bg2:#223246;--line:#324760;--ink:#f3f6fa;--muted:#9fb1c5}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:12px 14px 40px}

/* top bar */
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.brand{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.5px;line-height:1;margin-right:auto}
.brand span{color:var(--amber)}
.modes{display:flex;max-width:100%;overflow-x:auto;scrollbar-width:none;background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.modes button{white-space:nowrap;flex-shrink:0;border:0;background:none;padding:8px 10px;border-radius:7px;font-size:14px;color:var(--muted);min-height:38px}
.modes button[aria-pressed="true"]{background:var(--line);color:var(--ink)}
.iconbtn{border:1px solid var(--line);background:var(--bg2);border-radius:10px;min-height:40px;padding:0 12px;font-size:14px}

/* match header */
.match{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;padding:4px 2px 12px;border-bottom:1px solid var(--line);margin-bottom:14px}
.match h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(28px,6vw,44px);line-height:.95;text-transform:uppercase;letter-spacing:.3px}
.match h1 .vs{color:var(--muted);font-weight:600;font-size:.6em;margin:0 .25em}
.match .sub{font-size:14px;color:var(--muted);margin-top:6px}
.match .sub b{color:var(--ink);font-weight:500}
.formation{margin-left:auto;font-family:var(--display);font-weight:700;font-size:28px;line-height:1;color:var(--amber)}
.formation small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400;text-align:right}

/* layout */
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* pitch */
.pitch{position:relative;width:min(100%,calc(80vh * 68 / 88));margin:0 auto;aspect-ratio:68/88;border-radius:14px;overflow:hidden;
  background:repeating-linear-gradient(180deg,var(--grass1) 0 11.1%,var(--grass2) 11.1% 22.2%);box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
@media (max-width:860px){.pitch{width:min(100%,calc(74vh * 68 / 92));aspect-ratio:68/92}}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:22%;border:0;background:none;padding:0;touch-action:manipulation}
.flip{--cw:clamp(42px,11vw,62px);width:var(--cw);height:calc(var(--cw)*1.28);perspective:500px;display:block}
.flip .inner{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.25,1.35,.5,1)}
.flip.flipped .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.face.front{background:linear-gradient(160deg,#1b2838,#0d1520);border:2px solid rgba(255,255,255,.25);transition:border-color .2s,box-shadow .2s}
.face.front b{font-family:var(--display);font-weight:800;font-size:calc(var(--cw)*.42);line-height:1;color:#6f8399}
.face.front em{font-style:normal;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.3vw,12px);color:rgba(255,255,255,.7);margin-top:2px}
.face.back{transform:rotateY(180deg);justify-content:flex-start;padding:3px 3px 2px;border:2px solid var(--edge);
  background:linear-gradient(170deg,#2a3a4d 0%,#131d29 70%);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.ctop{display:flex;justify-content:space-between;width:100%;padding:0 2px;line-height:1}
.ctop i{font-style:normal;font-family:var(--display);font-weight:700;font-size:clamp(9px,2.2vw,12px);color:#dfe7ef}
.jersey{width:100%;flex:1;min-height:0;margin-top:1px}
.slot.target .face.front{border-color:var(--amber);box-shadow:0 0 0 3px rgba(242,184,75,.3)}
.slot.target .face.front b{color:var(--amber)}
.slot.missed .face.back{border:2px dashed #7a8594;background:#141c26}
.slot.missed .ctop i{color:#9aa6b4}
.slot.missed .jersey{filter:grayscale(1) brightness(.75)}
.slot .nm{animation:fadein .3s .45s both;font-size:clamp(10px,2.6vw,13px);font-weight:700;line-height:1.1;margin-top:2px;color:#fff;text-align:center;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6);background:rgba(10,20,30,.55);padding:1px 5px;border-radius:4px}
.slot.missed .nm{background:rgba(80,20,20,.7)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}

/* panel */
.panel{display:flex;flex-direction:column;gap:14px}
.counter{display:flex;align-items:center;gap:12px}
.lives{display:flex;gap:5px}
.lives i{width:clamp(12px,3.4vw,22px);height:8px;border-radius:3px;background:var(--amber)}
.lives i.used{background:var(--miss)}
.counter .txt{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.05}.counter .txt small{display:block;font-family:var(--body);font-weight:400;font-size:12px;color:var(--muted)}
.counter .found{margin-left:auto;font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.counter .found span{color:var(--ok)}
.rule{font-size:13px;color:var(--muted);margin:-6px 0 0}

.aim{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:12px}
.aim .head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.aim .head strong{font-family:var(--display);font-size:22px;font-weight:700;color:var(--amber)}
.aim .head span{font-size:13px;color:var(--muted)}
.aim .head button{margin-left:auto;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;padding:4px}
.blanks{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px}
.blanks .w{display:flex;gap:3px}
.blanks .w i{width:clamp(14px,3.6vw,20px);height:4px;background:var(--muted);border-radius:2px;margin-top:18px;display:block;position:relative}
.blanks .w i b{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-style:normal;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink)}
.hints{display:flex;flex-wrap:wrap;gap:6px}
.hint{border:1.5px solid rgba(242,184,75,.7);background:rgba(242,184,75,.12);border-radius:10px;padding:7px 12px;font-size:13px;font-weight:500;min-height:38px;color:var(--amber);transition:background .15s,transform .1s}
.hint:hover{background:rgba(242,184,75,.22)}
.hint:active{transform:scale(.97)}
.hint.open{border-color:var(--amber);background:var(--amber);color:#1b1404;font-weight:700;opacity:1;animation:stamp .35s ease both}
.hint:disabled:not(.open){border-color:var(--line);background:none;color:var(--muted);opacity:.5;cursor:default}

.entry{position:relative}
.entry input{width:100%;font-size:16px;padding:14px 14px;border-radius:12px;border:2px solid var(--line);background:#0b131d;color:var(--ink);outline:none}
.entry input:focus{border-color:var(--amber)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--line);border-radius:12px;overflow:hidden;z-index:20;max-height:320px;overflow-y:auto;box-shadow:0 12px 30px rgba(0,0,0,.45)}
.sugg button{display:flex;width:100%;text-align:left;border:0;background:none;padding:12px 14px;border-bottom:1px solid var(--line);font-size:15px;gap:8px;align-items:center}
.sugg button:last-child{border-bottom:0}
.sugg button.act,.sugg button:hover{background:var(--line)}
.sugg small{margin-left:auto;color:var(--muted);font-size:12px}
.msg{min-height:20px;font-size:14px;color:var(--muted)}
.msg.good{color:var(--ok)} .msg.warn{color:var(--near)} .msg.bad{color:var(--bad)}

.history{display:flex;flex-direction:column;gap:10px}
.g{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center}
.g .n{font-family:var(--display);font-weight:700;font-size:14px;color:var(--muted);grid-row:span 2;width:34px}
.g.hit .n{grid-row:auto}.g .meta{font-size:12px;color:var(--muted)}
.g .meta b{color:var(--ink);font-weight:500}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tiles .w{display:flex;gap:2px}
.tile{width:clamp(20px,5.4vw,28px);height:clamp(24px,6.4vw,32px);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:clamp(14px,3.8vw,18px);border-radius:4px;background:var(--miss);color:#fff;animation:flip .35s ease both}
.tile.c{background:var(--ok)} .tile.p{background:var(--near);color:#1b1404} .tile.a{background:var(--miss)}
@keyframes flip{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
.legend{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* result */
.result{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:16px}
.result h2{margin:0;font-family:var(--display);font-weight:800;font-size:38px;line-height:1}
.result h2.win{color:var(--ok)} .result h2.lose{color:var(--bad)}
.result .big{font-family:var(--display);font-size:22px;font-weight:700;margin:4px 0 10px}
.result dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 14px;font-size:14px}
.result dt{color:var(--muted)} .result dd{margin:0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;min-height:46px;font-weight:500}
.btn.primary{background:var(--amber);color:#1b1404;border-color:var(--amber);font-weight:700}

/* sheets */
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--ink);padding:0;width:min(520px,94vw);max-height:88vh}
dialog::backdrop{background:rgba(3,8,14,.7)}
.sheet{padding:18px}
.sheet h3{margin:0 0 12px;font-family:var(--display);font-size:26px;font-weight:700}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted)}
.field select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stats div{background:var(--bg);border-radius:10px;padding:10px}
.stats b{display:block;font-family:var(--display);font-size:26px;line-height:1}
.stats span{font-size:12px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.note{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.board{display:flex;flex-direction:column;gap:5px;margin:4px 0 12px}
.brow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brow .who{font-size:12px;color:var(--muted)}
.tile.e{background:none;border:2px solid var(--line);animation:none}
.slot .pips{font-size:clamp(9px,2.3vw,11px);color:var(--amber);background:rgba(10,20,30,.6);padding:0 4px;border-radius:4px;margin-top:2px;white-space:nowrap}
.recap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.rc{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:var(--bg2);border-left:3px solid var(--ok);border-radius:6px;padding:8px 10px;font-size:13px}
.rc.no{border-left-color:var(--bad)} .rc b{font-family:var(--display);color:var(--muted)} .rc small{color:var(--muted)}
.conf{position:absolute;width:7px;height:11px;border-radius:1px;pointer-events:none;z-index:6;transform:translate(-50%,-50%);animation:conf 1.2s cubic-bezier(.15,.7,.35,1) both}
@keyframes conf{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}80%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) rotate(var(--r))}}
.slot.celebrate{z-index:4}
.slot.celebrate .face.back{animation:glow 1.1s ease-out .55s 2}
@keyframes glow{0%{box-shadow:0 0 0 0 rgba(242,184,75,.95)}100%{box-shadow:0 0 0 16px rgba(242,184,75,0)}}
.cele{animation:rise .35s ease both}
.cele.hit{border-color:var(--ok);background:linear-gradient(180deg,rgba(63,166,107,.18),var(--bg2) 60%)}
.cele.miss{border-color:var(--bad);background:linear-gradient(180deg,rgba(217,89,76,.14),var(--bg2) 60%)}
.cele-top{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.badge{font-family:var(--display);font-weight:800;font-size:24px;line-height:1;padding:4px 10px;border-radius:8px;animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.cele.hit .badge{background:var(--ok);color:#06140c}
.cele.miss .badge{background:var(--bad);color:#1c0806}
.cele-name{font-family:var(--display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.05;margin:10px 0 2px}
.cele-name b{color:var(--amber);font-weight:700;margin-right:4px}
.cele-meta{font-size:13px;color:var(--muted);margin-bottom:8px}
.btn.next{width:100%;font-size:16px}
@keyframes stamp{0%{transform:scale(2.2) rotate(-8deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes rise{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.flip{position:relative}
.ev{position:absolute;z-index:3;pointer-events:none;line-height:1}
.ev.goal{right:-8px;bottom:2px;width:19px;height:19px;border-radius:50%;box-shadow:0 0 0 2px #0f1824,0 2px 4px rgba(0,0,0,.4)}
.ev.goal svg{width:100%;height:100%;display:block}
.ev.goal b{position:absolute;right:-7px;bottom:-5px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:#0f1824;color:#fff;font-family:var(--display);font-size:11px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 1.5px #f4f7fa}
.ev.red{left:-5px;top:-5px;width:10px;height:13px;background:#e03a2f;border-radius:2px;box-shadow:0 0 0 1.5px #0f1824}
.ev.mom{right:-7px;top:-7px;width:18px;height:18px;border-radius:50%;background:#2f7cf6;color:#fff;font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 1.5px #0f1824}
.evnote{flex-basis:100%;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.ev-i{display:inline-grid;place-items:center;margin-left:6px}
.ev-i:first-child{margin-left:0}
.ev-i.ball{width:15px;height:15px}.ev-i.ball svg{width:100%;height:100%}
.ev-i.red{width:8px;height:11px;background:#e03a2f;border-radius:2px}
.ev-i.mom{width:15px;height:15px;border-radius:50%;background:#2f7cf6;color:#fff;font-size:9px}
.hintbar{display:flex;align-items:baseline;gap:8px;margin:2px 0 8px;padding-top:10px;border-top:1px solid var(--line)}
.hb-t{font-family:var(--display);font-weight:800;font-size:18px;color:var(--amber);line-height:1;white-space:nowrap;flex-shrink:0}
.hb-s{font-size:12.5px;color:var(--muted)}
.hintbar.nudge .hb-s{color:var(--amber);font-weight:500}
.hintbar.nudge + .hints .hint:not(:disabled){animation:nudge 1.6s ease-in-out 2}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(242,184,75,0)}50%{box-shadow:0 0 0 5px rgba(242,184,75,.35)}}
.aim .head{align-items:center;flex-wrap:wrap}
.aim .head .lenbig{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;color:var(--ink);margin-left:6px}
.aim .head .lenbig small{font-family:var(--body);font-size:14px;font-weight:700;margin-left:2px;color:var(--ink)}
.aim .head .lensub{font-size:15px;color:#c3cfdc;font-weight:500}
.aim .head .lensub b{color:var(--amber);font-family:var(--display);font-size:18px}
.erow{display:flex;gap:8px}
.field2{position:relative;flex:1;min-width:0}
.field2 input{padding-right:64px}
.qc{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-family:var(--display);font-weight:700;font-size:18px;color:var(--muted);pointer-events:none}
.qc.full{color:var(--amber)}
.btn.go{min-width:72px;border-radius:12px;font-size:16px}
.sugg button{flex-wrap:wrap;gap:2px 10px}
.sugg button b{font-family:var(--display);font-size:18px;font-weight:700}
.sugg button .full{color:var(--muted);font-size:13px}
.giveup{display:flex;justify-content:flex-end;gap:14px;margin-top:-6px}
.gbtn{border:0;background:none;color:var(--muted);font-size:12.5px;padding:8px 2px;text-decoration:underline;text-underline-offset:3px;min-height:36px}
.gbtn.armed{color:#fff;background:var(--bad);text-decoration:none;border-radius:8px;padding:8px 10px;font-weight:700}
.cele.rev{border-color:#7a8594;background:linear-gradient(180deg,rgba(122,133,148,.18),var(--bg2) 60%)}
.cele.rev .badge{background:#7a8594;color:#0d141c}
.cele-full{font-size:13px;color:var(--muted);margin-bottom:2px}
.catlist{display:flex;flex-direction:column;gap:10px;margin:6px 0 14px}
.catbtn{display:flex;align-items:center;gap:14px;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:14px 16px;min-height:64px}
.catbtn:hover{border-color:var(--amber)}
.catbtn .ci{font-size:28px;line-height:1}
.catbtn .ct{display:flex;flex-direction:column;gap:2px}
.catbtn b{font-family:var(--display);font-size:22px;letter-spacing:.5px;line-height:1}
.catbtn small{color:var(--muted);font-size:12.5px}
.randbtn{width:100%;margin-bottom:12px;font-size:16px}
.yeargrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:14px;max-height:52vh;overflow-y:auto}
.ybtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-height:58px}
.ybtn:hover{border-color:var(--amber)}
.ybtn b{font-family:var(--display);font-size:20px;line-height:1}
.srcbadge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;font-weight:500;background:var(--line);color:var(--ink)}
.srcbadge.official{background:rgba(63,166,107,.25);color:#8fe0b1}
.srcbadge.fan_vote{background:rgba(47,124,246,.25);color:#a9c8ff}
.srcbadge.statistical{background:rgba(242,184,75,.2);color:var(--amber)}
.srcbadge.media{background:rgba(217,89,76,.22);color:#f3aaa2}
.srclink{color:var(--muted)}
.dailytag{flex-basis:100%;font-size:13px;color:var(--amber);font-weight:500;margin-bottom:-4px}
.dailytag b{font-family:var(--display);font-size:16px}
.dailybox{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.dnext{font-size:14px;color:var(--muted);margin-bottom:10px}
.dnext b{font-family:var(--display);font-size:22px;color:var(--ink);margin-left:6px;letter-spacing:.5px}
.lbform{display:flex;gap:8px;margin-bottom:10px}
.lbform input{flex:1;min-width:0;font-size:16px;padding:12px;border-radius:10px;border:2px solid var(--line);background:#0b131d;color:var(--ink)}
.lbform input:focus{border-color:var(--amber);outline:none}
.lbdone{font-size:14px;margin:0 0 10px}
.rtabs{display:flex;gap:6px;margin-bottom:12px}
.rtabs button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:14px;color:var(--muted)}
.rtabs button.on{border-color:var(--amber);color:var(--amber);font-weight:700}
.rank{list-style:none;margin:0 0 12px;padding:0;max-height:55vh;overflow-y:auto}
.rank li{display:grid;grid-template-columns:32px 1fr;gap:0 8px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
.rank li.me{background:rgba(242,184,75,.1);border-radius:8px}
.rank .rk{grid-row:span 2;font-family:var(--display);font-weight:800;font-size:22px;color:var(--muted);text-align:center}
.rank li:nth-child(1) .rk{color:#f2c94c}.rank li:nth-child(2) .rk{color:#cfd8e3}.rank li:nth-child(3) .rk{color:#d99a5b}
.rank .rn{font-weight:700}
.rank .rs{font-size:13px;color:var(--muted)}
.rank .rs b{color:var(--ink);font-family:var(--display);font-size:16px}
.dailytag .nk{color:var(--ink);font-weight:700}
.nkedit{border:1px solid var(--line);background:none;color:var(--muted);border-radius:6px;font-size:11.5px;padding:2px 7px;margin-left:2px}
.lbdone.warn{color:var(--near)}
#dlgNick::backdrop{background:rgba(3,8,14,.85)}
.inrank{margin:4px 0 12px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.inrank-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.inrank-head>b{font-family:var(--display);font-size:18px}
.inrank-head span{font-size:13px;color:var(--muted);margin-right:auto}
.inrank-head span b{color:var(--amber)}
.inrank .rank{max-height:none;margin:0}
.inrank .rank li{grid-template-columns:28px 1fr auto;padding:7px 4px}
.inrank .rank .rk{grid-row:auto;font-size:18px}
.inrank .rank .rs{font-size:12px;text-align:right;white-space:nowrap}
.inrank .rank .rs b{font-size:15px}
.rank li.gap{display:block;text-align:center;color:var(--muted);padding:2px;border:0}
.rank .rn em{font-style:normal;font-size:11px;color:#1b1404;background:var(--amber);border-radius:5px;padding:0 5px;margin-left:4px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Starting <span>XI</span></div>
    <nav class="modes" id="modes" aria-label="게임 모드">
      <button data-mode="daily">📅 오늘의 XI</button>
      <button data-mode="classic">Classic</button>
      <button data-mode="random">Random</button>
      <button data-mode="club">Club</button>
      <button data-mode="worldcup">World Cup</button>
      <button data-mode="bestxi">Best XI</button>
    </nav>
    <button class="iconbtn" id="btnPick">경기 선택</button>
    <button class="iconbtn" id="btnRank">🏆 랭킹</button>
    <button class="iconbtn" id="btnStats">통계</button>
  </header>

  <section class="match" id="match"></section>

  <main class="grid">
    <div><div class="pitch" id="pitch"></div></div>
    <div class="panel" id="panel"></div>
  </main>
</div>

<dialog id="dlgPick"><div class="sheet">
  <h3>경기 선택</h3>
  <div class="field"><label for="fComp">대회</label><select id="fComp"></select></div>
  <div class="field"><label for="fTeam">팀</label><select id="fTeam"></select></div>
  <div class="field"><label for="fSeason">시즌 / 연도</label><select id="fSeason"></select></div>
  <div class="field"><label for="fStage">경기 단계</label><select id="fStage"></select></div>
  <p class="note" id="fCount"></p>
  <div class="row"><button class="btn" id="fCancel">닫기</button><button class="btn primary" id="fGo">이 조건으로 시작</button></div>
</div></dialog>

<dialog id="dlgBest"><div class="sheet" id="bestBody"></div></dialog>
<dialog id="dlgNick"><div class="sheet" id="nickBody"></div></dialog>
<dialog id="dlgRank"><div class="sheet" id="rankBody"></div></dialog>
<dialog id="dlgStats"><div class="sheet" id="statsBody"></div></dialog>

   ===================================================================== */
const SPECIAL = {"ł":"l","Ł":"l","ø":"o","Ø":"o","ß":"ss","æ":"ae","ı":"i","đ":"d","Đ":"d","œ":"oe"};
function normalize(s){
  return s.replace(/[łŁøØßæıđĐœ]/g,c=>SPECIAL[c]).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase()
          .replace(/[’'`.]/g,"").replace(/[-\s]+/g," ").trim();
}
const letters = s => normalize(s).replace(/[^a-z]/g,"");
const words = s => normalize(s).split(" ").map(w=>w.replace(/[^a-z]/g,"")).filter(Boolean);

/* Wordle 판정용 이름: 기본은 성(姓). van/de/di/ter/mac 같은 접두어는 포함. 통칭이 다른 선수만 예외 지정 */
const WORDLE_NAME = {park:"Park",son:"Son",davidluiz:"David Luiz",filipeluis:"Filipe Luís",diegocosta:"Diego Costa",bernardo:"Bernardo",
  alexsandro:"Alex Sandro",luizgustavo:"Luiz Gustavo",juliocesar:"Júlio César",thiago:"Thiago",vinicius:"Vinícius",lautaro:"Lautaro",
  saul:"Saúl",amad:"Amad",jamesrodriguez:"James",alexis:"Alexis",igorthiago:"Igor Thiago",gabriel:"Gabriel",kolomuani:"Kolo Muani",raulgarcia:"Raúl García"};
const PARTICLES = new Set(["van","der","den","de","di","da","dos","ter","von","mac","le","la","del"]);
function surnameOf(name){
  const w=name.split(" "); let i=w.length-1;
  while(i>0 && PARTICLES.has(w[i-1].toLowerCase())) i--;
  return w.slice(i).join(" ");
}
/* player DB build */
const DB = {};
for (const [id,[name,nat,short,aliases,tag]] of Object.entries(PLAYERS)){
  const parts = name.split(" ");
  DB[id] = {playerId:id,name,wname:WORDLE_NAME[id]||surnameOf(name),nationality:nat,tag:tag||null,short:short||parts[parts.length-1],
    normalizedName:normalize(name), keys:[name,...(aliases||[]),short||""].filter(Boolean).map(normalize)};
}

function bestSlots(lines){
  const ys = {3:[73,47,20]}[lines.length] || [74,56,37,18];
  const lab = lines.length===3 ? ["DF","MF","FW"] : ["DF","MF","AM","FW"];
  const s=[["GK",50,91]];
  lines.forEach((n,li)=>{ for(let i=0;i<n;i++){ const x = n===1?50 : 88-i*(76/(n-1)); s.push([lab[li],x,ys[li]]); } });
  return s;
}

/* =====================================================================
   3) WORDLE 판정 — 글자 등장 횟수를 반영하는 정식 방식
   ===================================================================== */
function evaluate(guessName, answerName){
  const g = letters(guessName), a = letters(answerName);
  const res = Array(g.length).fill("a"), left = {};
  for (let i=0;i<a.length;i++) if (g[i]!==a[i]) left[a[i]]=(left[a[i]]||0)+1;
  for (let i=0;i<g.length;i++) if (i<a.length && g[i]===a[i]) res[i]="c";
  for (let i=0;i<g.length;i++) if (res[i]!=="c" && left[g[i]]>0){ res[i]="p"; left[g[i]]--; }
  return res; // c=초록, p=노랑, a=회색
}

const STAT_KEY="startingxi_stats_v1";
function blankStats(){return {games:0,wins:0,found:0,guesses:0,perfect:0,streak:0,best:0,teams:{},seasons:{},byType:{club:{games:0,wins:0,found:0},worldcup:{games:0,wins:0,found:0},bestxi:{games:0,wins:0,found:0}}}}
function loadStats(){try{const s=JSON.parse(localStorage.getItem(STAT_KEY));return s?{...blankStats(),...s}:blankStats()}catch(e){return blankStats()}}
function saveStats(s){try{localStorage.setItem(STAT_KEY,JSON.stringify(s))}catch(e){}}
function recordGame(st){
  const s=loadStats(), L=st.lineup, found=st.found.size, win=found===11;
  s.games++; s.found+=found; s.guesses+=st.guesses.length;
  if(win){s.wins++; s.streak++; s.best=Math.max(s.best,s.streak); if(st.hints.length===0) s.perfect++;} else s.streak=0;
  const tk=L.type==="bestxi"?L.title:L.team, sk=(L.type==="club"||L.type==="bestxi"?L.season:L.year+" WC");
  s.teams[tk]=(s.teams[tk]||0)+1; s.seasons[sk]=(s.seasons[sk]||0)+1;
  const b=(s.byType[L.type] = s.byType[L.type] || {games:0,wins:0,found:0}); b.games++; b.found+=found; if(win) b.wins++;
  saveStats(s);
}

/* =====================================================================
   5) GAME STATE — 선수(자리)마다 6번의 추측 기회
   ===================================================================== */
const MAX_TRIES = 6;
const HINTS = [
  {k:"number",label:"등번호",cost:1,get:p=>p.shirtNumber!=null?"#"+p.shirtNumber:null},
  {k:"nat",label:"국적",cost:2,get:p=>p.nationality},
  {k:"club",label:"당시 소속팀",cost:2,get:p=>p.club},
  {k:"first",label:"첫 글자",cost:3,get:p=>letters(p.wname)[0].toUpperCase()},
];
let S = null;

function newGame(lineup,opts={}){
  S = {lineup, daily:!!opts.daily, day:opts.day||null, found:new Set(), failed:new Set(), tries:Array(11).fill(0), guesses:[], hints:[],
       target:0, over:false, won:false, shown:new Set(), revealed:new Set(), pause:null, recorded:false};
  S.target = nextOpen(0);
  render();
}
const isOpen = i => !S.found.has(i) && !S.failed.has(i);
function nextOpen(from=0){
  for(let k=0;k<11;k++){const i=(from+k)%11; if(isOpen(i)) return i;}
  return from%11;
}
const maxLen = () => letters(S.lineup.players[S.target].wname).length;
/* 답안 = 자유 문자열. 정답 판정은 현재 자리 선수의 성(wname)과 글자 비교 */
function submitGuess(input){
  if(S.over || S.pause || !isOpen(S.target)) return;
  const ps=S.lineup.players, t=S.target, T=ps[t];
  const raw=String(input||"").trim().replace(/\s+/g," "), L=letters(raw), max=maxLen();
  if(!L.length) return flash("글자를 입력해 주세요.","warn");
  if(L.length>max) return flash(`이 자리는 ${max}글자까지만 입력할 수 있어요.`,"warn");
  if(S.guesses.some(g=>g.target===t && letters(g.text)===L)) return flash("이 자리에 이미 입력한 답이에요. 기회는 그대로입니다.","warn");
  S.tries[t]++;
  const hit = L===letters(T.wname);
  S.guesses.push({text:raw,target:t,res:evaluate(raw,T.wname),hit});
  if(hit){ S.found.add(t); S.pause={slot:t,type:"hit"}; }
  else if(S.tries[t]>=MAX_TRIES){ S.failed.add(t); S.pause={slot:t,type:"miss"}; }
  else flash(`${T.position} 자리 정답이 아니에요. 남은 기회 ${MAX_TRIES-S.tries[t]}번.`,"bad",false);
  return settle();
}
function settle(){
  if(S.found.size===11) return finish(true);
  if(S.found.size+S.failed.size===11) return finish(false);
  render();
}
/* 정답 공개: 현재 자리만 종료 */
function revealSlot(){
  if(S.over || S.pause || !isOpen(S.target)) return;
  const t=S.target; S.failed.add(t); S.revealed.add(t); S.pause={slot:t,type:"reveal"};
  settle();
}
/* 포기: 남은 자리 전부 공개하고 게임 종료 */
function giveUpAll(){
  if(S.over) return;
  for(let i=0;i<11;i++) if(isOpen(i)){ S.failed.add(i); S.revealed.add(i); }
  S.gaveUp=true; finish(false);
}

function armConfirm(btn,label,fn){
  if(btn.dataset.armed){ fn(); return; }
  btn.dataset.armed="1"; const old=btn.innerHTML; btn.classList.add("armed"); btn.textContent=label;
  setTimeout(()=>{ if(btn.isConnected){ delete btn.dataset.armed; btn.classList.remove("armed"); btn.innerHTML=old; } },3000);

function goNext(to){

function useHint(k){
  if(S.over || S.pause) return;

function finish(won){
  S.over=true; S.won=won; S.pause=null;
  if(won){ const g=S; setTimeout(()=>{ if(S!==g) return; const k=KITS[S.lineup.team]||DEFAULT_KIT;[[50,30],[25,55],[75,55],[50,80]].forEach(([x,y],j)=>setTimeout(()=>spawnConfetti(x,y,[k.p,k.s,"#f2b84b","#ffffff"],34,1.8),j*160));},700); }
  if(!S.recorded){recordGame(S); S.recorded=true;}

const triesLeftTotal = () => [...S.found].reduce((t,i)=>t+MAX_TRIES-S.tries[i],0) + [...Array(11).keys()].filter(isOpen).reduce((t,i)=>t+MAX_TRIES-S.tries[i],0);
function score(){
  const hp=S.hints.reduce((t,h)=>t+HINTS.find(x=>x.k===h.split(":")[1]).cost,0);
  const bonus=[...S.found].reduce((t,i)=>t+(MAX_TRIES-S.tries[i]),0);
  return Math.max(0, S.found.size*10 + bonus*2 - hp*2);
}

let MODE="classic", FILTER={comp:"all",team:"all",season:"all",stage:"all"};
function poolFor(mode){
  if(mode==="club") return POOL.filter(l=>l.type==="club");
  if(mode==="worldcup") return POOL.filter(l=>l.type==="worldcup");
  if(mode==="random") return POOL;
  return applyFilter(POOL,FILTER);
}
function applyFilter(list,f){
  return list.filter(l=>(f.comp==="all"||l.competition===f.comp)&&(f.team==="all"||l.team===f.team)
    &&(f.season==="all"||seasonOf(l)===f.season)&&(f.stage==="all"||l.stage===f.stage));
}
function pick(list, avoidId){
  const c = list.length>1 ? list.filter(l=>l.id!==avoidId) : list;
  return c[Math.floor(Math.random()*c.length)];
}
function startMode(mode, opts={}){
  if(mode==="bestxi"){
    MODE="bestxi"; const cur=S&&S.lineup;
    let list = opts.otherComp&&cur ? BEST_POOL.filter(l=>l.category!==cur.category) : BEST_POOL.filter(l=>!BEST_CAT||l.category===BEST_CAT);
    if(!list.length) list=BEST_POOL;
    const p=pick(list,cur&&cur.id); BEST_CAT=p.category; return newGame(p);
  }
  MODE=mode;
  let list=poolFor(mode);
  const cur=S&&S.lineup;
  if(opts.otherTeam&&cur){const o=list.filter(l=>l.team!==cur.team); if(o.length) list=o;}
  if(opts.otherComp&&cur){const o=list.filter(l=>l.competition!==cur.competition); if(o.length) list=o; else {const all=POOL.filter(l=>l.competition!==cur.competition); if(all.length){list=all;MODE="random";}}}
  if(!list.length){list=POOL; MODE="random";}
  newGame(pick(list,cur&&cur.id));
}

/* 자동완성: 편의 기능일 뿐 답안을 제한하지 않음. 3글자부터, 글자 수 초과 선수는 제외 */
function search(q,max){
  const n=normalize(q); if(letters(n).length<3) return [];
  const out=[];
  for(const p of SUGGEST){
    if(p.len>max) continue;
    let rank=9;
    if(p.wkey.startsWith(n)) rank=0;
    else if(p.keys.some(k=>k.startsWith(n))) rank=1;
    else if(p.keys.some(k=>k.split(" ").some(w=>w.startsWith(n)))) rank=2;
    if(rank<9) out.push([rank,p]);
  }
  return out.sort((a,b)=>a[0]-b[0]||a[1].len-b[1].len||a[1].name.localeCompare(b[1].name)).slice(0,8).map(x=>x[1]);
}
function bindPanel(){
  const q=$("#q"), box=$("#sugg");
  const nb=$("#btnNext"); if(nb){ nb.addEventListener("click",()=>goNext()); setTimeout(()=>nb.focus({preventScroll:true}),0); }
  $("#nextSlot")?.addEventListener("click",()=>{S.target=nextOpen(S.target+1); render();});
  document.querySelectorAll("[data-hint]").forEach(b=>b.addEventListener("click",()=>useHint(b.dataset.hint)));
  document.querySelectorAll("[data-act]").forEach(b=>b.addEventListener("click",()=>{
    const a=b.dataset.act;
    if(a==="share") return doShare();
    if(a==="rank") return openRank();
    if(a==="classic") return startMode("classic");
    if(a==="retry") newGame(S.lineup);
    else if(a==="new") startMode(MODE);
    else if(a==="team") startMode(MODE,{otherTeam:true});
    else startMode(MODE,{otherComp:true});
  }));
  const r1=$("#btnReveal"); r1&&r1.addEventListener("click",()=>armConfirm(r1,"한 번 더 누르면 공개돼요",revealSlot));
  const r2=$("#btnGiveAll"); r2&&r2.addEventListener("click",()=>armConfirm(r2,"한 번 더 누르면 포기해요",giveUpAll));
  if(!q) return;
  const max=maxLen(), qc=$("#qc");
  let items=[], act=-1;
  const count=()=>{ const n=letters(q.value).length; qc.textContent=`${n}/${max}`; qc.classList.toggle("full",n===max); };
  const draw=()=>{
    if(!items.length){box.hidden=true; box.innerHTML=""; return;}
    box.hidden=false;
    box.innerHTML=items.map((p,i)=>`<button type="button" class="${i===act?"act":""}" data-i="${i}"><b>${esc(p.wname)}</b><span class="full">${esc(p.name)}</span>${p.tag?`<small>${esc(p.tag)}</small>`:""}</button>`).join("");
    box.querySelectorAll("button").forEach(b=>b.addEventListener("pointerdown",e=>{e.preventDefault(); fill(items[+b.dataset.i]);}));
  };
  const fill=p=>{ if(!p||p.len>max) return; q.value=p.wname; items=[]; act=-1; draw(); count(); q.focus({preventScroll:true}); };
  const submit=()=>{ const v=q.value; items=[]; draw(); submitGuess(v); setTimeout(()=>{const nq=$("#q"); if(nq) nq.focus({preventScroll:true});},0); };
  q.addEventListener("input",()=>{
    let v=q.value.replace(/[^\p{L}\s'’.\-]/gu,"");
    while(letters(v).length>max) v=v.slice(0,-1);
    if(v!==q.value) q.value=v;
    count(); items=search(v,max); act=-1; draw();
  });
  q.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"&&items.length){act=(act+1)%items.length; draw(); e.preventDefault();}
    else if(e.key==="ArrowUp"&&items.length){act=act<=0?items.length-1:act-1; draw(); e.preventDefault();}
    else if(e.key==="Enter"){ e.preventDefault(); if(act>=0&&items[act]) fill(items[act]); else submit(); }
    else if(e.key==="Escape"){items=[]; act=-1; draw();}
  });
  q.addEventListener("blur",()=>setTimeout(()=>{items=[];draw()},150));
  $("#btnGo").addEventListener("pointerdown",e=>e.preventDefault());
  $("#btnGo").addEventListener("click",submit);
  count();
}

  const all=[...POOL,...BEST_POOL].sort((a,b)=>a.id.localeCompare(b.id));

  if(S.over){ startCountdown(); loadInlineRank(); }
}
/* 결과 화면 안에 바로 보이는 랭킹 (상위 10명 + 내 순위) */
function rankRowsHTML(rows, me, limit){
  const row=(r,i)=>`<li class="${r.nickname===me?"me":""}"><span class="rk">${i+1}</span><span class="rn">${esc(r.nickname)}${r.nickname===me?" <em>나</em>":""}</span><span class="rs"><b>${r.score}</b>점 · ${r.found}/11 · ${r.guesses}회${r.hints?` · 힌트${r.hints}`:""}</span></li>`;
  const myIdx=rows.findIndex(r=>r.nickname===me);
  let html=rows.slice(0,limit).map(row).join("");
  if(myIdx>=limit) html+=`<li class="gap">⋯</li>`+row(rows[myIdx],myIdx);
  return `<ol class="rank">${html}</ol>`;
}
async function loadInlineRank(){
  if(!LB_ON||!S||!S.daily||!S.over) return;
  const g=S;
  if(g.rankLoading) return;
  if(g.rankAt && Date.now()-g.rankAt<30000){ return; }          // 30초 안에는 다시 안 불러옴
  if(!g.submitted && !g.submitError && getNick()) return;       // 자동 등록이 끝난 뒤에 불러오기
  g.rankLoading=true;
  try{
    const rows=await lbFetch(g.day), me=g.submitted||getNick();
    const myIdx=rows.findIndex(r=>r.nickname===me);
    g.rankHTML = `<div class="inrank-head"><b>🏆 오늘의 랭킹</b><span>${rows.length}명 참여${myIdx>=0?` · 내 순위 <b>${myIdx+1}위</b>`:""}</span><button class="nkedit" id="rankRefresh">새로고침</button></div>`
      + (rows.length ? rankRowsHTML(rows, me, 10) : `<p class="note">아직 등록된 기록이 없어요.</p>`);
  }catch(e){ g.rankHTML=`<p class="note">랭킹을 불러오지 못했어요. <button class="nkedit" id="rankRefresh">다시 시도</button></p>`; }
  g.rankAt=Date.now(); g.rankLoading=false;
  if(S===g){ const box=$("#inRank"); if(box){ box.innerHTML=g.rankHTML; bindRankRefresh(); } }
}
function bindRankRefresh(){ const b=$("#rankRefresh"); if(b) b.onclick=()=>{ S.rankAt=0; $("#inRank").innerHTML=`<p class="note">불러오는 중…</p>`; loadInlineRank(); }; }
const dlgR=$("#dlgRank");
async function openRank(which=0){
  const day=dayKeyOf(-which), body=$("#rankBody");
  const tabs=`<div class="rtabs"><button class="${which===0?"on":""}" data-w="0">오늘 #${dayNumber(dayKeyOf())}</button>${dayNumber(dayKeyOf(-1))>=1?`<button class="${which===1?"on":""}" data-w="1">어제 #${dayNumber(dayKeyOf(-1))}</button>`:""}</div>`;
  const shell=inner=>{ body.innerHTML=`<h3>🏆 오늘의 XI 랭킹</h3>${tabs}${inner}<div class="row"><button class="btn primary" data-close>닫기</button></div>`;
    body.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>openRank(+b.dataset.w)); body.querySelector("[data-close]").onclick=()=>dlgR.close(); };
  if(!dlgR.open) dlgR.showModal();
  if(!LB_ON){ shell(`<p class="note">랭킹 서버(Supabase)가 아직 연결되지 않았어요. 코드 상단의 <code>LEADERBOARD</code>에 주소와 키를 넣으면 켜져요.</p>`); return; }
  shell(`<p class="note">불러오는 중…</p>`);
  try{
    const rows=await lbFetch(day), me=(()=>{try{return localStorage.getItem(NICK_KEY)}catch(e){return null}})();
    shell(rows.length ? `<ol class="rank">${rows.map((r,i)=>`<li class="${r.nickname===me?"me":""}"><span class="rk">${i+1}</span><span class="rn">${esc(r.nickname)}</span><span class="rs"><b>${r.score}</b>점 · ${r.found}/11 · ${r.guesses}회${r.hints?` · 힌트${r.hints}`:""}</span></li>`).join("")}</ol>`
      : `<p class="note">아직 등록된 기록이 없어요. 첫 번째가 되어보세요!</p>`);
  }catch(e){ shell(`<p class="note">랭킹을 불러오지 못했어요.</p>`); }
}

$("#btnRank").addEventListener("click",()=>openRank());
startDaily();
</script>
